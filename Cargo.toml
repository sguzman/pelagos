[package]
name = "pelagos"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Rust-native media server pursuing complete Jellyfin Server compatibility"
license = "MIT"
repository = "https://github.com/sguzman/pelagos"
publish = false

[dependencies]
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
