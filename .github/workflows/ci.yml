name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    # Stable FFmpeg-equipped runner baseline; ubuntu-latest can migrate to
    # an image whose apt components have not yet exposed universe packages.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Verify committed dependency lock
        run: test -s Cargo.lock
      - name: FFmpeg and FFprobe prerequisites
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Tests
        env:
          PELAGOS_REQUIRE_FFMPEG: "1"
        run: cargo test --locked --all-targets
      - name: Evidence-backed roadmap
        run: cargo run --locked --quiet --bin pelagos-roadmap -- --check
      - name: Pinned upstream source matrix
        run: cargo run --locked --quiet --bin pelagos-matrix -- --check
      - name: Lockfile immutability
        run: git diff --exit-code -- Cargo.lock
      - name: Pinned controller route attributes
        run: cargo run --locked --quiet --bin pelagos-api-matrix -- --check
