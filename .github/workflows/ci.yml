name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: FFmpeg and FFprobe prerequisites
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Tests
        env:
          PELAGOS_REQUIRE_FFMPEG: "1"
        run: cargo test --all-targets
      - name: Evidence-backed roadmap
        run: cargo run --quiet --bin pelagos-roadmap -- --check
      - name: Pinned upstream source matrix
        run: cargo run --quiet --bin pelagos-matrix -- --check
      - name: Pinned controller route attributes
        run: cargo run --quiet --bin pelagos-api-matrix -- --check
